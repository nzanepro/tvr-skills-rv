name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install numpy Pillow pytest PyYAML strictyaml
      - name: Run tests
        run: python -m pytest tests -q

  plugin-validate:
    # `claude plugin validate` reads local files only and needs no login. The
    # Claude Code version is pinned so a new release cannot change the result.
    runs-on: ubuntu-latest
    env:
      DISABLE_AUTOUPDATER: "1"
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.284
      - name: Validate the marketplace and plugin manifests
        run: |
          claude plugin validate . --strict
          claude plugin validate .claude-plugin/plugin.json --strict
