name: release

# On a version tag (v0.2.3), check the repository, build one zip per skill and publish a
# GitHub release with the tag's CHANGELOG.md section as its notes. If a release for the tag
# already exists (made by hand), its notes are left alone and only the zips are uploaded.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: python -m pip install numpy Pillow pytest PyYAML strictyaml
      - name: Run tests
        run: python -m pytest tests -q
      - name: Check the repository
        run: python scripts/check_repo.py
      - name: Build skill zips and release notes
        run: python scripts/build_release.py --tag "$GITHUB_REF_NAME" --out dist
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.zip \
              --verify-tag --title "$GITHUB_REF_NAME" --notes-file dist/release-notes.md
          fi
